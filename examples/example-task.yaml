apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: demo-workspace
  atespace: default
spec:
  git:
    - name: origin
      repo: "https://github.com/google/ax.git"
      branch: "main"
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: demo-task
  atespace: default
spec:
  debug: true
  image: "localhost:5001/ax/ax-task-runner@sha256:9928e9d1f82f8c0a47d2c0705a8fe3f05858cf7fd09bd461ff128a5e358c1ef0"
  workspaces:
    - name: demo-workspace
      path: "/workspace"
  env:
    - name: DEMO_ENV
      value: "active"
