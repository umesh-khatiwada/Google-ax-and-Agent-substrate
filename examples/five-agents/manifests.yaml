      \  <- Tool Output: {content[:100]}...\")\n                messages.append({\"\
      role\": \"tool\", \"tool_call_id\": tc[\"id\"], \"content\": content})\n   \
      \     else:\n            final_report = resp.get(\"content\") or resp.get(\"\
      reasoning_content\") or \"\"\n            break\n\n    is_full = (\"###\" in\
