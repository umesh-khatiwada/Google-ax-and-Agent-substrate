      \   }\n            }\n        elif method == \"tools/list\":\n            res\
      \ = {\n                \"jsonrpc\": \"2.0\",\n                \"id\": req_id,\n\
      \                \"result\": {\"tools\": role_tools}\n            }\n      \
      \  elif method == \"tools/call\":\n            params = req.get(\"params\",\
      \ {})\n            name = params.get(\"name\")\n            args = params.get(\"\
      arguments\", {})\n            tool_output = execute_tool(name, args)\n     \
      \       res = {\n                \"jsonrpc\": \"2.0\",\n                \"id\"\
      : req_id,\n                \"result\": {\n                    \"content\": [{\"\
      type\": \"text\", \"text\": json.dumps(tool_output)}]\n                }\n \
      \           }\n        else:\n            res = {\n                \"jsonrpc\"\
      : \"2.0\",\n                \"id\": req_id,\n                \"error\": {\"\
      code\": -32601, \"message\": f\"Method {method} not found\"}\n            }\n\
      \n        sys.stdout.write(json.dumps(res) + \"\\n\")\n        sys.stdout.flush()\n\
      \nif __name__ == \"__main__\":\n    main()\n"
  - path: agent_runner.py
    content: "#!/usr/bin/env python3\n# Agent Execution Engine:\n# 1. Spawns connected\
      \ MCP tool server via JSON-RPC 2.0 stdio\n# 2. Queries NVIDIA Nemotron LLM (nvidia/nemotron-3-super-120b-a12b)\n\
      # 3. Executes tool calls against the connected MCP server\n# 4. Synthesizes\
      \ executive report and writes to /workspace/<role>-report.md\n# 5. Signals completion\n\
      import sys\nimport os\nimport json\nimport subprocess\nimport urllib.request\n\
      \nROLE = os.getenv(\"AGENT_ROLE\", \"security\")\nAPI_KEY = os.getenv(\"OPENAI_API_KEY\"\
      , \"YOUR_NVIDIA_API_KEY\"\
      )\nBASE_URL = os.getenv(\"OPENAI_BASE_URL\", \"https://integrate.api.nvidia.com/v1\"\
      )\nMODEL = os.getenv(\"MODEL_NAME\", \"nvidia/nemotron-3-super-120b-a12b\")\n\
      WORKSPACE_DIR = os.getenv(\"WORKSPACE_DIR\", \"/workspace\")\nMCP_SCRIPT = os.path.join(WORKSPACE_DIR,\
      \ \"mcp_server.py\")\n\nclass MCPClient:\n    def __init__(self, script_path):\n\
      \        self.proc = subprocess.Popen(\n            [sys.executable, script_path],\n\
      \            stdin=subprocess.PIPE,\n            stdout=subprocess.PIPE,\n \
      \           stderr=subprocess.PIPE,\n            text=True,\n            bufsize=1\n\
      \        )\n        self.msg_id = 0\n\n    def call(self, method, params=None):\n\
      \        self.msg_id += 1\n        req = {\n            \"jsonrpc\": \"2.0\"\
      ,\n            \"id\": self.msg_id,\n            \"method\": method,\n     \
      \       \"params\": params or {}\n        }\n        self.proc.stdin.write(json.dumps(req)\
      \ + \"\\n\")\n        self.proc.stdin.flush()\n        line = self.proc.stdout.readline()\n\
      \        if not line:\n            raise RuntimeError(\"MCP server closed stdout\
      \ unexpectedly\")\n        return json.loads(line.strip())\n\n    def close(self):\n\
      \        try:\n            self.proc.terminate()\n            self.proc.wait(timeout=2)\n\
      \        except Exception:\n            self.proc.kill()\n\ndef main():\n  \
      \  print(f\"================================================================\"\
      )\n    print(f\" Starting Agent [{ROLE}] with Model [{MODEL}]\")\n    print(f\"\
      ================================================================\")\n\n    #\
      \ 1. Connect to local MCP Server\n    print(f\"[{ROLE}] Initializing MCP server\
      \ at {MCP_SCRIPT}...\")\n    mcp = MCPClient(MCP_SCRIPT)\n    init_res = mcp.call(\"\
      initialize\", {\"protocolVersion\": \"2024-11-05\"})\n    print(f\"[{ROLE}]\
      \ Connected to MCP Server: {init_res.get('result', {}).get('serverInfo', {})}\"\
      )\n\n    # 2. Discover available tools from MCP\n    tools_res = mcp.call(\"\
      tools/list\")\n    mcp_tools = tools_res.get(\"result\", {}).get(\"tools\",\
      \ [])\n    print(f\"[{ROLE}] Discovered {len(mcp_tools)} tools from MCP server:\"\
      )\n    for t in mcp_tools:\n        print(f\"  - {t['name']}: {t['description']}\"\
      )\n\n    # 3. Format tools into OpenAI Function Calling specification\n    openai_tools\
      \ = [\n        {\n            \"type\": \"function\",\n            \"function\"\
      : {\n                \"name\": t[\"name\"],\n                \"description\"\
      : t[\"description\"],\n                \"parameters\": t[\"inputSchema\"]\n\
      \            }\n        }\n        for t in mcp_tools\n    ]\n\n    # 4. Prepare\
      \ system prompt and user query\n    tool_names = [t[\"name\"] for t in mcp_tools]\n\
      \    tool_descriptions = \"\\n\".join([f\"- {t['name']}: {t['description']}\"\
      \ for t in mcp_tools])\n\n    system_prompt = (\n        f\"You are the specialized\
      \ {ROLE.upper()} Agent running inside Google AX sandbox at {WORKSPACE_DIR}.\\\
      n\"\n        f\"Your mission is to perform a thorough {ROLE} evaluation by calling\
      \ the available tools from your \"\n        f\"connected MCP tool server, and\
      \ then write a comprehensive, executive Markdown report.\\n\\n\"\n        f\"\
      Connected MCP Tools available for invocation:\\n{tool_descriptions}\\n\\n\"\n\
      \        f\"Always invoke the relevant MCP tools to gather telemetry before\
      \ writing your final executive report.\"\n    )\n    user_prompt = (\n     \
      \   f\"Please execute the complete {ROLE} audit and evaluation on {WORKSPACE_DIR}.\
      \ \"\n        f\"Invoke the relevant MCP tools ({', '.join(tool_names)}) to\
      \ gather telemetry, then synthesize your analysis.\"\n    )\n\n    messages\
      \ = [\n        {\"role\": \"system\", \"content\": system_prompt},\n       \
      \ {\"role\": \"user\", \"content\": user_prompt}\n    ]\n\n    def call_llm(msgs,\
      \ tools_list=None):\n        import time\n        for attempt in range(3):\n\
      \            try:\n                payload = {\n                    \"model\"\
      : MODEL,\n                    \"messages\": msgs,\n                    \"max_tokens\"\
      : 1500,\n                    \"temperature\": 0.2\n                }\n     \
      \           if tools_list:\n                    payload[\"tools\"] = tools_list\n\
      \                req = urllib.request.Request(\n                    f\"{BASE_URL}/chat/completions\"\
      ,\n                    headers={\n                        \"Authorization\"\
      : f\"Bearer {API_KEY}\",\n                        \"Content-Type\": \"application/json\"\
      ,\n                        \"Connection\": \"close\"\n                    },\n\
      \                    data=json.dumps(payload).encode(\"utf-8\")\n          \
      \      )\n                with urllib.request.urlopen(req, timeout=45) as resp:\n\
      \                    data = json.loads(resp.read().decode(\"utf-8\"))\n    \
      \                return data[\"choices\"][0][\"message\"]\n            except\
      \ Exception as e:\n                if attempt == 2:\n                    raise\n\
      \                print(f\"[{ROLE}] LLM call attempt {attempt+1} encountered\
      \ {e}; retrying in 2s...\")\n                time.sleep(2)\n\n    # 5. Multi-turn\
      \ ReAct tool execution loop\n    max_turns = 6\n    turn = 0\n    final_report_text\
      \ = \"\"\n\n    while turn < max_turns:\n        turn += 1\n        print(f\"\
      [{ROLE}] Turn {turn}/{max_turns}: Querying NVIDIA Nemotron...\")\n        resp\
      \ = call_llm(messages, openai_tools)\n        tool_calls = resp.get(\"tool_calls\"\
      )\n\n        if tool_calls:\n            print(f\"[{ROLE}] Nemotron requested\
