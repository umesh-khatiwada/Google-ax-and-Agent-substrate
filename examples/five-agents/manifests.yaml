      \    return {\"status\": \"UNKNOWN\", \"tool\": name}\n\ndef main():\n    role_tools\
      \ = TOOLS.get(ROLE, [])\n    for line in sys.stdin:\n        line = line.strip()\n\
      \        if not line:\n            continue\n        try:\n            req =\
      \ json.loads(line)\n        except Exception:\n            continue\n\n    \
      \    req_id = req.get(\"id\")\n        method = req.get(\"method\")\n\n    \
      \    if method == \"initialize\":\n            res = {\n                \"jsonrpc\"\
