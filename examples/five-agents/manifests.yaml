      tools/call\", {\"name\": fn_name, \"arguments\": fn_args})\n               \
      \ tool_content = mcp_output.get(\"result\", {}).get(\"content\", [{}])[0].get(\"\
      text\", \"{}\")\n                print(f\"  <- Tool Output: {tool_content[:100]}...\"\
      )\n\n                messages.append({\n                    \"role\": \"tool\"\
      ,\n                    \"tool_call_id\": tc[\"id\"],\n                    \"\
      content\": tool_content\n                })\n        else:\n            final_report_text\
      \ = resp.get(\"content\") or \"\"\n            if not final_report_text.strip():\n\
      \                final_report_text = resp.get(\"reasoning_content\") or \"\"\
      \n            print(f\"[{ROLE}] Nemotron finished tool execution and generated\
      \ response.\")\n            break\n\n    # If still empty after tool iterations,\
      \ prompt for report synthesis\n    if not final_report_text.strip() or (\"We\
      \ need to invoke\" in final_report_text and \"tools\" in final_report_text):\n\
      \        print(f\"[{ROLE}] Prompting final report synthesis...\")\n        messages.append({\n\
      \            \"role\": \"user\",\n            \"content\": (\n             \
      \   f\"All diagnostic MCP tools have now completed execution and their telemetry\
