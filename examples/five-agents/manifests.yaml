apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: sre-workspace
  atespace: default
spec:
  files:
  - path: mcp_server.py
    content: "#!/usr/bin/env python3\n# Model Context Protocol (MCP) Standard stdio\
      \ Server\n# Provides domain tools tailored to the agent's role.\nimport sys\n\
      import json\nimport os\n\nROLE = os.getenv(\"AGENT_ROLE\", \"security\")\n\n\
      TOOLS = {\n    \"security\": [\n        {\n            \"name\": \"audit_permissions\"\
      ,\n            \"description\": \"Audits filesystem permissions, file modes,\
      \ and security configurations.\",\n            \"inputSchema\": {\n        \
      \        \"type\": \"object\",\n                \"properties\": {\"target_path\"\
      : {\"type\": \"string\", \"description\": \"Path to audit\"}},\n           \
      \     \"required\": [\"target_path\"]\n            }\n        },\n        {\n\
      \            \"name\": \"scan_cve_database\",\n            \"description\":\
      \ \"Scans package and runtime dependencies against known CVE databases.\",\n\
      \            \"inputSchema\": {\n                \"type\": \"object\",\n   \
      \             \"properties\": {\n                    \"ecosystem\": {\"type\"\
      : \"string\", \"description\": \"Runtime ecosystem (e.g. python, linux)\"},\n\
      \                    \"component\": {\"type\": \"string\", \"description\":\
      \ \"Component to scan\"}\n                },\n                \"required\":\
      \ [\"ecosystem\", \"component\"]\n            }\n        }\n    ],\n    \"linter\"\
      : [\n        {\n            \"name\": \"check_python_syntax\",\n           \
      \ \"description\": \"Parses and validates Python source code files for syntax\
      \ errors and PEP8 compliance.\",\n            \"inputSchema\": {\n         \
      \       \"type\": \"object\",\n                \"properties\": {\"target_dir\"\
      : {\"type\": \"string\", \"description\": \"Directory containing code to check\"\
      }},\n                \"required\": [\"target_dir\"]\n            }\n       \
      \ },\n        {\n            \"name\": \"analyze_complexity\",\n           \
      \ \"description\": \"Calculates cyclomatic complexity and function maintainability\
      \ index.\",\n            \"inputSchema\": {\n                \"type\": \"object\"\
      ,\n                \"properties\": {\"file_pattern\": {\"type\": \"string\"\
      , \"description\": \"Glob pattern of files to analyze\"}},\n               \
      \ \"required\": [\"file_pattern\"]\n            }\n        }\n    ],\n    \"\
      perf\": [\n        {\n            \"name\": \"sample_memory_profile\",\n   \
      \         \"description\": \"Samples RSS, heap memory, page faults, and cgroup\
      \ limits for the current environment.\",\n            \"inputSchema\": {\n \
      \               \"type\": \"object\",\n                \"properties\": {\"interval_seconds\"\
      : {\"type\": \"integer\", \"description\": \"Sampling interval duration\"}},\n\
      \                \"required\": [\"interval_seconds\"]\n            }\n     \
      \   },\n        {\n            \"name\": \"benchmark_cpu\",\n            \"\
      description\": \"Runs a compute benchmark evaluating virtual CPU throughput\
      \ and context switches.\",\n            \"inputSchema\": {\n               \
      \ \"type\": \"object\",\n                \"properties\": {\"iterations\": {\"\
      type\": \"integer\", \"description\": \"Number of calculation cycles\"}},\n\
      \                \"required\": [\"iterations\"]\n            }\n        }\n\
      \    ],\n    \"docs\": [\n        {\n            \"name\": \"generate_openapi_spec\"\
      ,\n            \"description\": \"Generates an OpenAPI 3.0 specification document\
      \ for task endpoints.\",\n            \"inputSchema\": {\n                \"\
      type\": \"object\",\n                \"properties\": {\n                   \
      \ \"service_name\": {\"type\": \"string\", \"description\": \"Name of service\
      \ to document\"},\n                    \"version\": {\"type\": \"string\", \"\
      description\": \"API Version\"}\n                },\n                \"required\"\
      : [\"service_name\", \"version\"]\n            }\n        },\n        {\n  \
      \          \"name\": \"validate_markdown_links\",\n            \"description\"\
      : \"Scans documentation markdown files for broken references and formatting\
      \ issues.\",\n            \"inputSchema\": {\n                \"type\": \"object\"\
      ,\n                \"properties\": {\"doc_path\": {\"type\": \"string\", \"\
      description\": \"Path to documentation\"}},\n                \"required\": [\"\
      doc_path\"]\n            }\n        }\n    ],\n    \"sre\": [\n        {\n \
      \           \"name\": \"probe_readiness\",\n            \"description\": \"\
      Checks health and probe responsiveness of local service endpoints (/readyz,\
      \ /healthz).\",\n            \"inputSchema\": {\n                \"type\": \"\
      object\",\n                \"properties\": {\"endpoint_url\": {\"type\": \"\
      string\", \"description\": \"Health probe endpoint URL\"}},\n              \
      \  \"required\": [\"endpoint_url\"]\n            }\n        },\n        {\n\
      \            \"name\": \"evaluate_resilience\",\n            \"description\"\
      : \"Simulates failure scenarios and computes Mean Time to Recovery (MTTR) metrics.\"\
      ,\n            \"inputSchema\": {\n                \"type\": \"object\",\n \
      \               \"properties\": {\"scenario\": {\"type\": \"string\", \"description\"\
      : \"Chaos test or failover scenario\"}},\n                \"required\": [\"\
      scenario\"]\n            }\n        }\n    ]\n}\n\ndef execute_tool(name, args):\n\
      \    if ROLE == \"security\":\n        if name == \"audit_permissions\":\n \
      \           return {\"status\": \"PASS\", \"path\": args.get(\"target_path\"\
      , \"/workspace\"), \"owner\": \"root:root\", \"mode\": \"0755\", \"issues_found\"\
      : 0, \"finding\": \"Secure filesystem mode, no setuid/setgid vulnerabilities.\"\
      }\n        elif name == \"scan_cve_database\":\n            return {\"status\"\
      : \"CLEAN\", \"ecosystem\": args.get(\"ecosystem\"), \"component\": args.get(\"\
      component\"), \"cve_count\": 0, \"advisories\": []}\n    elif ROLE == \"linter\"\
      :\n        if name == \"check_python_syntax\":\n            return {\"status\"\
      : \"CLEAN\", \"directory\": args.get(\"target_dir\"), \"syntax_errors\": 0,\
      \ \"ast_parse_status\": \"Valid\", \"pep8_compliance\": \"100%\"}\n        elif\
      \ name == \"analyze_complexity\":\n            return {\"status\": \"OPTIMAL\"\
      , \"cyclomatic_complexity_average\": 1.8, \"maintainability_index\": 92.4, \"\
      grade\": \"A+\"}\n    elif ROLE == \"perf\":\n        if name == \"sample_memory_profile\"\
      :\n            return {\"status\": \"OPTIMAL\", \"memory_rss_mb\": 31.8, \"\
      memory_limit_mb\": 4096, \"memory_utilization_pct\": 0.77, \"cgroup_throttled\"\
      : False}\n        elif name == \"benchmark_cpu\":\n            return {\"status\"\
      : \"OPTIMAL\", \"iterations\": args.get(\"iterations\", 1000), \"compute_ops_sec\"\
      : 1580000, \"jitter_ms\": 0.38, \"rating\": \"High Performance\"}\n    elif\
      \ ROLE == \"docs\":\n        if name == \"generate_openapi_spec\":\n       \
      \     return {\"status\": \"GENERATED\", \"service\": args.get(\"service_name\"\
      ), \"openapi_version\": \"3.0.3\", \"endpoints\": [\"/metadata/v1alpha1/ax/task\"\
      , \"/readyz\", \"/healthz\"]}\n        elif name == \"validate_markdown_links\"\
      :\n            return {\"status\": \"VALID\", \"total_links_verified\": 12,\
      \ \"broken_links\": 0, \"syntax_errors\": 0}\n    elif ROLE == \"sre\":\n  \
      \      if name == \"probe_readiness\":\n            return {\"status\": \"HEALTHY\"\
      , \"target\": args.get(\"endpoint_url\"), \"http_status\": 200, \"latency_ms\"\
      : 1.4, \"checks\": [\"readyz\", \"livez\"]}\n        elif name == \"evaluate_resilience\"\
      :\n            return {\"status\": \"RESILIENT\", \"scenario\": args.get(\"\
      scenario\"), \"estimated_mttr_sec\": 3.8, \"fault_tolerance_score\": 99.2}\n\
      \    return {\"status\": \"UNKNOWN\", \"tool\": name}\n\ndef main():\n    role_tools\
      \ = TOOLS.get(ROLE, [])\n    for line in sys.stdin:\n        line = line.strip()\n\
      \        if not line:\n            continue\n        try:\n            req =\
      \ json.loads(line)\n        except Exception:\n            continue\n\n    \
      \    req_id = req.get(\"id\")\n        method = req.get(\"method\")\n\n    \
      \    if method == \"initialize\":\n            res = {\n                \"jsonrpc\"\
      : \"2.0\",\n                \"id\": req_id,\n                \"result\": {\n\
      \                    \"protocolVersion\": \"2024-11-05\",\n                \
      \    \"capabilities\": {\"tools\": {}},\n                    \"serverInfo\"\
      : {\"name\": f\"{ROLE}-mcp-server\", \"version\": \"1.0.0\"}\n             \
      \   }\n            }\n        elif method == \"tools/list\":\n            res\
      \ = {\n                \"jsonrpc\": \"2.0\",\n                \"id\": req_id,\n\
      \                \"result\": {\"tools\": role_tools}\n            }\n      \
      \  elif method == \"tools/call\":\n            params = req.get(\"params\",\
      \ {})\n            name = params.get(\"name\")\n            args = params.get(\"\
      arguments\", {})\n            tool_output = execute_tool(name, args)\n     \
      \       res = {\n                \"jsonrpc\": \"2.0\",\n                \"id\"\
      : req_id,\n                \"result\": {\n                    \"content\": [{\"\
      type\": \"text\", \"text\": json.dumps(tool_output)}]\n                }\n \
      \           }\n        else:\n            res = {\n                \"jsonrpc\"\
      : \"2.0\",\n                \"id\": req_id,\n                \"error\": {\"\
      code\": -32601, \"message\": f\"Method {method} not found\"}\n            }\n\
      \n        sys.stdout.write(json.dumps(res) + \"\\n\")\n        sys.stdout.flush()\n\
      \nif __name__ == \"__main__\":\n    main()\n"
  - path: agent_runner.py
    content: "#!/usr/bin/env python3\n# Agent Execution Engine:\n# 1. Spawns connected\
      \ MCP tool server via JSON-RPC 2.0 stdio\n# 2. Queries NVIDIA Nemotron LLM (nvidia/nemotron-3-super-120b-a12b)\n\
      # 3. Executes tool calls against the connected MCP server\n# 4. Synthesizes\
      \ executive report and writes to /workspace/<role>-report.md\n# 5. Signals completion\n\
      import sys\nimport os\nimport json\nimport subprocess\nimport urllib.request\n\
      \nROLE = os.getenv(\"AGENT_ROLE\", \"security\")\nAPI_KEY = os.getenv(\"OPENAI_API_KEY\"\
      , \"YOUR_NVIDIA_API_KEY\"\
      )\nBASE_URL = os.getenv(\"OPENAI_BASE_URL\", \"https://integrate.api.nvidia.com/v1\"\
      )\nMODEL = os.getenv(\"MODEL_NAME\", \"nvidia/nemotron-3-super-120b-a12b\")\n\
      WORKSPACE_DIR = os.getenv(\"WORKSPACE_DIR\", \"/workspace\")\nMCP_SCRIPT = os.path.join(WORKSPACE_DIR,\
      \ \"mcp_server.py\")\n\nclass MCPClient:\n    def __init__(self, script_path):\n\
      \        self.proc = subprocess.Popen(\n            [sys.executable, script_path],\n\
      \            stdin=subprocess.PIPE,\n            stdout=subprocess.PIPE,\n \
      \           stderr=subprocess.PIPE,\n            text=True,\n            bufsize=1\n\
      \        )\n        self.msg_id = 0\n\n    def call(self, method, params=None):\n\
      \        self.msg_id += 1\n        req = {\n            \"jsonrpc\": \"2.0\"\
      ,\n            \"id\": self.msg_id,\n            \"method\": method,\n     \
      \       \"params\": params or {}\n        }\n        self.proc.stdin.write(json.dumps(req)\
      \ + \"\\n\")\n        self.proc.stdin.flush()\n        line = self.proc.stdout.readline()\n\
      \        if not line:\n            raise RuntimeError(\"MCP server closed stdout\
      \ unexpectedly\")\n        return json.loads(line.strip())\n\n    def close(self):\n\
      \        try:\n            self.proc.terminate()\n            self.proc.wait(timeout=2)\n\
      \        except Exception:\n            self.proc.kill()\n\ndef main():\n  \
      \  print(f\"================================================================\"\
      )\n    print(f\" Starting Agent [{ROLE}] with Model [{MODEL}]\")\n    print(f\"\
      ================================================================\")\n\n    #\
      \ 1. Connect to local MCP Server\n    print(f\"[{ROLE}] Initializing MCP server\
      \ at {MCP_SCRIPT}...\")\n    mcp = MCPClient(MCP_SCRIPT)\n    init_res = mcp.call(\"\
      initialize\", {\"protocolVersion\": \"2024-11-05\"})\n    print(f\"[{ROLE}]\
      \ Connected to MCP Server: {init_res.get('result', {}).get('serverInfo', {})}\"\
      )\n\n    # 2. Discover available tools from MCP\n    tools_res = mcp.call(\"\
      tools/list\")\n    mcp_tools = tools_res.get(\"result\", {}).get(\"tools\",\
      \ [])\n    print(f\"[{ROLE}] Discovered {len(mcp_tools)} tools from MCP server:\"\
      )\n    for t in mcp_tools:\n        print(f\"  - {t['name']}: {t['description']}\"\
      )\n\n    # 3. Format tools into OpenAI Function Calling specification\n    openai_tools\
      \ = [\n        {\n            \"type\": \"function\",\n            \"function\"\
      : {\n                \"name\": t[\"name\"],\n                \"description\"\
      : t[\"description\"],\n                \"parameters\": t[\"inputSchema\"]\n\
      \            }\n        }\n        for t in mcp_tools\n    ]\n\n    # 4. Prepare\
      \ system prompt and user query\n    system_prompt = (\n        f\"You are the\
      \ specialized {ROLE.upper()} Agent running inside Google AX sandbox at {WORKSPACE_DIR}.\
      \ \"\n        f\"Your mission is to perform a thorough {ROLE} evaluation by\
      \ calling the available tools from your \"\n        f\"connected MCP tool server,\
      \ and then write a comprehensive, executive Markdown report.\"\n    )\n    user_prompt\
      \ = (\n        f\"Please execute the complete {ROLE} audit and evaluation on\
      \ {WORKSPACE_DIR}. \"\n        f\"Invoke all relevant MCP tools to gather telemetry,\
      \ then synthesize your analysis.\"\n    )\n\n    messages = [\n        {\"role\"\
      : \"system\", \"content\": system_prompt},\n        {\"role\": \"user\", \"\
      content\": user_prompt}\n    ]\n\n    def call_llm(msgs, tools_list=None):\n\
      \        import time\n        for attempt in range(3):\n            try:\n \
      \               payload = {\n                    \"model\": MODEL,\n       \
      \             \"messages\": msgs,\n                    \"max_tokens\": 1024\n\
      \                }\n                if tools_list:\n                    payload[\"\
      tools\"] = tools_list\n                req = urllib.request.Request(\n     \
      \               f\"{BASE_URL}/chat/completions\",\n                    headers={\n\
      \                        \"Authorization\": f\"Bearer {API_KEY}\",\n       \
      \                 \"Content-Type\": \"application/json\",\n                \
      \        \"Connection\": \"close\"\n                    },\n               \
      \     data=json.dumps(payload).encode(\"utf-8\")\n                )\n      \
      \          with urllib.request.urlopen(req, timeout=45) as resp:\n         \
      \           data = json.loads(resp.read().decode(\"utf-8\"))\n             \
      \       return data[\"choices\"][0][\"message\"]\n            except Exception\
      \ as e:\n                if attempt == 2:\n                    raise\n     \
      \           print(f\"[{ROLE}] LLM call attempt {attempt+1} encountered {e};\
      \ retrying in 2s...\")\n                time.sleep(2)\n\n    # 5. Turn 1: Send\
      \ query to NVIDIA Nemotron\n    print(f\"[{ROLE}] Querying NVIDIA Nemotron model\
      \ ({MODEL})...\")\n    msg1 = call_llm(messages, openai_tools)\n    tool_calls\
      \ = msg1.get(\"tool_calls\")\n\n    if tool_calls:\n        print(f\"[{ROLE}]\
      \ Nemotron requested {len(tool_calls)} tool call(s):\")\n        messages.append({\n\
      \            \"role\": \"assistant\",\n            \"content\": msg1.get(\"\
      content\") or \"\",\n            \"tool_calls\": tool_calls\n        })\n  \
      \      for tc in tool_calls:\n            fn_name = tc[\"function\"][\"name\"\
      ]\n            fn_args = json.loads(tc[\"function\"][\"arguments\"] or \"{}\"\
      )\n            print(f\"  -> Calling MCP Tool [{fn_name}] with args: {fn_args}\"\
      )\n\n            # Execute tool through connected MCP server\n            mcp_output\
      \ = mcp.call(\"tools/call\", {\"name\": fn_name, \"arguments\": fn_args})\n\
      \            tool_content = mcp_output.get(\"result\", {}).get(\"content\",\
      \ [{}])[0].get(\"text\", \"{}\")\n            print(f\"  <- Tool Output: {tool_content[:120]}...\"\
      )\n\n            messages.append({\n                \"role\": \"tool\",\n  \
      \              \"tool_call_id\": tc[\"id\"],\n                \"content\": tool_content\n\
      \            })\n\n        # 6. Turn 2: Synthesize final executive report\n\
      \        print(f\"[{ROLE}] Sending tool execution results back to Nemotron for\
      \ report synthesis...\")\n        msg2 = call_llm(messages)\n        final_report_text\
      \ = msg2.get(\"content\") or \"\"\n        if not final_report_text.strip():\n\
      \            final_report_text = msg2.get(\"reasoning_content\") or \"\"\n \
      \       if not final_report_text.strip():\n            final_report_text = f\"\
      ### {ROLE.upper()} Automated Assessment\\n\\n- **Status:** COMPLETED\\n- Verified\
      \ telemetry across all tools.\\n\"\n    else:\n        print(f\"[{ROLE}] Model\
      \ responded directly without additional tool calls.\")\n        final_report_text\
      \ = msg1.get(\"content\") or msg1.get(\"reasoning_content\") or f\"### {ROLE.upper()}\
      \ Assessment\\n- Status: COMPLETED\\n\"\n\n    mcp.close()\n\n    # 7. Write\
      \ report to /workspace/<role>-report.md\n    report_filename = f\"{ROLE}-report.md\"\
      \n    report_path = os.path.join(WORKSPACE_DIR, report_filename)\n    with open(report_path,\
      \ \"w\") as f:\n        f.write(f\"# Executive {ROLE.capitalize()} Report\\\
      n\\n\")\n        f.write(f\"- **Agent Role:** `{ROLE}`\\n\")\n        f.write(f\"\
      - **LLM Engine:** `{MODEL}`\\n\")\n        f.write(f\"- **Target Workspace:**\
      \ `{WORKSPACE_DIR}`\\n\\n\")\n        f.write(f\"---\\n\\n\")\n        f.write(final_report_text)\n\
      \        f.write(\"\\n\")\n\n    # 8. Write completion status marker\n    completion_marker\
      \ = os.path.join(WORKSPACE_DIR, \"COMPLETED\")\n    with open(completion_marker,\
      \ \"w\") as f:\n        f.write(json.dumps({\n            \"agent\": ROLE,\n\
      \            \"status\": \"COMPLETED\",\n            \"report_path\": report_path\n\
      \        }) + \"\\n\")\n\n    print(f\"[{ROLE}] Successfully generated: {report_path}\"\
      )\n    print(f\"[{ROLE}] Written completion marker: {completion_marker}\")\n\
      \    print(f\"================================================================\"\
      )\n    print(f\" Agent [{ROLE}] Task Completed Successfully!\")\n    print(f\"\
      ================================================================\")\n\nif __name__\
      \ == \"__main__\":\n    main()\n"
  mcp:
    servers:
    - name: sre-tools
      command: python3
      args:
      - /workspace/mcp_server.py
